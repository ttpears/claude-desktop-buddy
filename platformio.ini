[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKC_PLUS
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.17
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Power-measurement build: prints periodic PWR telemetry over serial and
; forces the idle/screen-off power path even while USB-tethered, so the
; battery code can be benchmarked with the on-chip AXP192 current meter.
; Flash with: pio run -e bench -t upload ; read with the serial monitor.
[env:m5sticks3]
platform = espressif32
board = m5stick-s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions/no_ota_8mb.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKS3
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.17
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:bench]
extends = env:m5stickc-plus
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKC_PLUS
    -DBUDDY_BENCH

; Crash diagnostics build: explicit Serial.begin + esp_reset_reason() readout
; (over serial at boot AND on the boot splash), setup phase markers, and the
; bench-style force-screen-off-while-USB so a screen-off/wake crash can be
; reproduced with serial connected. Unlike bench it does NOT disable charging.
[env:debug]
extends = env:m5stickc-plus
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKC_PLUS
    -DBUDDY_DEBUG

; From-source build (arduino as an esp-idf component) so sdkconfig.defaults
; applies — the only way to enable esp_pm automatic light sleep for a real
; battery win. lib_ignore=LittleFS: the arduino component already compiles
; LittleFS.cpp, so stop the LDF building a duplicate that fails to link.
; Forces screen-off-on-USB (BUDDY_DEBUG) for bench/serial testing.
[env:idf]
extends = env:m5stickc-plus
framework = arduino, espidf
lib_ignore = LittleFS
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKC_PLUS
    ; esp_littlefs comes from the joltwallet managed component; PlatformIO compiles
    ; arduino's LittleFS.cpp without that component's include path, so add it.
    -Imanaged_components/joltwallet__littlefs/include

; Same from-source esp_pm build with the debug harness (Serial.begin, reset-reason
; readout, setup markers, force-screen-off-on-USB) for bench/serial testing.
[env:idf-debug]
extends = env:idf
build_flags =
    ${env:idf.build_flags}
    -DBUDDY_DEBUG
