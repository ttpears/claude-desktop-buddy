name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        # Arduino (precompiled) envs only. The from-source `idf`/`idf-debug` envs
        # pull ESP-IDF + the joltwallet/littlefs managed component and build
        # everything from source (slow, network-dependent) — built locally, not CI.
        run: pio run -e m5stickc-plus -e m5sticks3 -e bench -e debug
