[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKC_PLUS
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.17
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Power-measurement build: prints periodic PWR telemetry over serial and
; forces the idle/screen-off power path even while USB-tethered, so the
; battery code can be benchmarked with the on-chip AXP192 current meter.
; Flash with: pio run -e bench -t upload ; read with the serial monitor.
[env:m5sticks3]
platform = espressif32
board = m5stick-s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions/no_ota_8mb.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKS3
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.17
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:bench]
extends = env:m5stickc-plus
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_STICKC_PLUS
    -DBUDDY_BENCH
